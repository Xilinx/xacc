- title: "A Development Platform for Managed Heterogeneous Accelerated Compute Clusters: A Case Study on ETH Zurich’s AMD HACC"
  author: "Javier Moya"
  institution: "ETH Zurich"
  link: "https://dl.acm.org/doi/10.1145/3805700"
  abstract: |
    "The growing demand for performance, energy efficiency, and domain-specific acceleration has driven a shift toward heterogeneous computing platforms. While hyperscaler cloud platforms offer broad access to compute resources, they often lack the flexibility required by advanced research workloads. In response, research institutions are increasingly deploying self-managed heterogeneous clusters, which remain difficult to maintain, configure, and use effectively. The Heterogeneous Accelerated Compute Clusters (HACCs) initiative, supported by the AMD University Program, addresses this by equipping select institutions with clusters composed of CPUs, GPUs, and adaptive devices for high-performance computing and AI research. This paper presents two complementary tools developed for such systems: HACC Management and Development. HACC Management is an Ansible-based automation framework for provisioning and maintaining HACC-like infrastructure in a reproducible and scalable way. HACC Development (hdev) is a lightweight Bash-based CLI that streamlines the development and deployment of heterogeneous applications. It orchestrates both environment and infrastructure setup and provides ready-to-use templates—example projects for user reference—that enable rapid iteration on real hardware. We demonstrate the design and capabilities of both tools using ETH Zurich's HACC as a case study. Our approach reduces operational overhead, enables faster prototyping, and provides a foundation for community-driven expansion of heterogeneous workflow support."

- title: "A heuristic approach for near Pareto-optimal design space exploration in Approximate High-Level Synthesis"
  author: "Tiago Da Silva Almeida"
  institution: "Universidade Federal do Tocantins"
  link: "https://www.sciencedirect.com/science/article/abs/pii/S0167926025002950"
  abstract: |
    "Approximate Computing can optimize resource usage in HLS (High-Level Synthesis) by mapping certain operations to components that have lower resource utilization but introduce small errors into application outputs. A fundamental challenge is identifying a set of approximate components for implementing operators in an accelerator design while achieving optimal resource utilization and accuracy. We introduce an input-aware heuristic approach that uses application inputs to model output errors more effectively. In this approach, operators in accelerators, such as adders and multipliers, are mapped to a library of precharacterized approximate components. Applications are executed with a set of training inputs and candidate solutions are selected based on a metric that combines output errors and estimated resource utilization. The results demonstrate that the approach can find appropriate approximate designs for a given error threshold. For image processing applications, the input-aware heuristic was able to save LUT and FF by up to 55% for less than 25% output degradation. Similar savings were shown for a CNN model with less than 0.8% accuracy degradation."

- title: "A Quantitative Evaluation of Approximate Softmax Functions for Deep Neural Networks"
  author: "Anthony Leiva-Valverde"
  institution: "Costa Rica Institute of Technology"
  link: "https://arxiv.org/abs/2501.13379"
  abstract: |
    "The softmax function is a widely used activation function in the output layers of neural networks, responsible for converting raw scores into class probabilities while introducing essential non-linearity. Implementing Softmax efficiently poses challenges on low-end FPGAs due to limited hardware resources and the computational complexity of exponential and division operations. This work evaluates approximate computing techniques for softmax acceleration using Taylor series and interpolation methods using Look-Up Tables (LUTs). These approximations aim to reduce execution time and resource consumption while maintaining acceptable levels of numerical precision. Our findings show that quadratic interpolation with LUTs yields the lowest numerical error. In contrast, Taylor-based approximations offer significantly better performance in terms of execution time and resource efficiency due to their computational simplicity. When applied to real-world deep learning models such as LeNet-5 and MobileNet v2, the first- and second-order Taylor approximations provided substantial trade-offs between accuracy and resource savings, achieving up to 0.2% accuracy degradation and 14% resource reduction compared to exact implementations. These results highlight the effectiveness of approximate Softmax designs on resource-constrained FPGAs and lay the groundwork for their integration into larger models, including large language models (LLMs)."

- title: "A3C3: AI Algorithm and Accelerator Co-design, Co-search, and Co-generation"
  author: "Selin Yildirim"
  institution: "UIUC"
  link: "https://arxiv.org/abs/2606.20869"
  abstract: |
    "We present a holistic methodology for artificial intelligence algorithm and accelerator co-design, co-search, and co-generation (A3C3), which jointly optimizes neural network architectures and their hardware implementations to address the inefficiencies of traditional top-down AI system design flows. Conventional AI deployment often treats model design and hardware mapping as separate stages: an algorithm is first developed for accuracy, and only afterward adapted to meet latency, throughput, energy, or resource constraints. This separation can lead to suboptimal systems, particularly as modern AI workloads become increasingly heterogeneous, memory-intensive, and platform-dependent. A3C3 instead parameterizes both algorithmic and accelerator design spaces and searches them jointly, enabling the automatic generation of model-accelerator pairs that better balance accuracy, latency, throughput, energy efficiency, and hardware utilization."

- title: "Adaptive aie–pl systems for efficient end-to-end pyramidal 3d image registration"
  author: "Giuseppe Sorrentino"
  institution: "Politecnico di Milano"
  link: "https://ieeexplore.ieee.org/abstract/document/11552692"
  github: "https://github.com/necst/peterpan"
  abstract: |
    "Modern accelerators maximize throughput through aggressive specialization. However, in many real-world applications, workloads often vary at runtime, requiring multiple bitstreams to handle such changes. As a result, frequent reconfigurations introduce substantial overhead that can dominate end-to-end execution time. This issue is particularly evident in AIE–PL systems, where statically scheduled AI Engines (AIEs) achieve high performance through compile-time optimization and are therefore typically tailored to fixed workloads. Although AIEs support Runtime Parameters (RTPs) under Processing System (PS) orchestration, RTPs are impractical for discrete hosts. For this reason, we present a structured approach to designing single-bitstream, runtime-adaptable AIE–PL accelerators that does not rely on RTPs, suitable for discrete hosts. We exploit the Programmable Logic (PL) to generate and stream a compact metadata packet that distributes workload configuration across a directed AIE graph before computation. By doing so, we deliberately trade a fraction of fixed-instance efficiency for flexibility. We validate our approach by devising PeterPan, a software-programmable AIE–PL accelerator for 3D image registration. PeterPan supports runtime-varying problem sizes and integrates seamlessly into multi-stage pipelines, such as pyramidal (coarse-to-fine) registration. To maximize PeterPan utilization, we couple it with an ad-hoc software module that employs a novel heuristic to rapidly select informative sub-volumes, keeping the accelerator continuously fed and preventing input-side stalls. On a VCK5000, PeterPan matches state-of-the-art accelerator performance while retaining software programmability. In the end-to-end task, instead, PeterPan delivers a 3.06× speedup and a 2.74× higher energy efficiency than the state-of-the-art AIE-PL accelerator."

- title: "AgRefactor: Refactoring for HLS Compatibility with a Self-Evolving Agentic Workflow"
  author: "Yang Zou"
  institution: "CMU, UCLA"
  link: "https://dl.acm.org/doi/abs/10.1145/3748173.3779566"
  abstract: |
    "High-Level Synthesis (HLS) provides a fast path from concepts to silicon, but practical HLS design flows begin with a tedious step: refactoring software into HLS-compatible programs. Converting real-world software remains challenging due to restrictive language support and the gap between software and hardware programming practices, and this preparatory phase can take domain experts days even for an initial synthesizable design. Existing automated refactoring methods and recent LLM-based workflows partially address this problem, yet they often fall short in generalizability, scalability, and cost efficiency. Our key insight is that long-term memory for self-evolving agents, combined with tool-integrated refactoring, enables accurate and scalable conversion of real-world software into HLS-compatible programs. We introduce AgRefactor, an LLM-based multi-agent workflow that equips agents with long-term memory specialized for HLS refactoring, using a dedicated knowledge format and a hybrid distance metric to measure task similarity. To reduce cost and improve scalability, AgRefactor integrates automated refactoring tools by coupling LLM-driven rewrites with HeteroRefactor. On 9 out of 11 challenging real-world benchmarks, which are 5-10× longer than the most complex cases studied in prior work, AgRefactor outperforms state-of-the-art approaches. Further pragma optimization yields a 2.65× geometric mean speedup over the initial synthesizable design. AgRefactor is fully automated, easy to reproduce, and will be open-sourced upon acceptance."

- title: "CAMTA: A Reconfigurable Multi-Region Activation Unit for Nonlinear Function Approximation"
  author: "Carlos Soto-Porras"
  institution: "Costa Rica Institute of Technology"
  link: "https://arxiv.org/abs/2608.02988"
  abstract: |
    "Nonlinear activation functions are widely used in machine learning workloads, but their direct hardware implementation is often costly, function-specific, or difficult to reuse across different models. This work introduces CAMTA, a 16-bit reconfigurable multi-region activation unit for nonlinear function approximation in FPGA and ASIC accelerators. CAMTA combines independent region thresholds, per-region polynomial degrees, coefficient sets, and execution modes over a shared Horner-based datapath. Unlike conventional polynomial or piecewise approximation units that mainly reconfigure coefficients or segment selection, CAMTA also reconfigures the computational behavior of each region through HORNER, CONST, ZERO, and IDENTITY modes, enabling the same hardware to support functions with different symmetry and tail behavior without resynthesis. FPGA validation on an AMD Alveo platform shows RMSE as low as 3.60×10−6 for CAMTA-assisted Softmax, outperforming the CORDIC-based Softmax baseline considered in this work by nearly one order of magnitude. FPGA HLS synthesis reports 3 DSPs, 802 FFs, 1756 LUTs, and an 11-cycle datapath latency. ASIC synthesis in TSMC 65 nm at 250 MHz reports 6632.40​μ​m2 total cell area and 1.3634​mW total power. Compared with a same-node, function-specific PLAC implementation, CAMTA incurs 2.20× area and 1.75× power overhead, in exchange for runtime configurability and reuse across multiple nonlinear functions."

- title: "EQUIP: EQUivariant preserving In-Place updates for Efficient Token Pruning"
  author: ""
  institution: "IISC"
  link: "https://openreview.net/forum?id=v3MSIxFjqe"
  abstract: |
    "Token-pruning has emerged as a pivotal focus in large language models (LLMs), driven by the need to enhance model efficiency while pre serving accuracy, especially for large sequence lengths. However, the eviction operation of token pruning methods causes “holes” in KV tensors, posing two major challenges: (1) The shift operation required to make the KV tensor contiguous results in significant copy overheads; (2) The changes in position indices due to token eviction leads to increased computational requirements for Rotary Positional Encoding(RoPE). To address these issues, we introduce (EQUIP), an EQUivariant preserving in-place token update mechanism that ensures the equivariance property of the operations performed in the attention computation. EQUIP offers two fundamental advantages: First, it combines eviction and a subsequent token insertion into an in-place replacement operation, which reduces the KV cache copy overheads significantly. Second, EQUIP reduces recomputation of rotation operations through a combination of in-place update, caching and a re-indexing strategy. Together, these optimizations enable EQUIP with StreamingLLM to achieve geomean speedups of 1.62× (or 1.47×) on CPU (GPU) over StreamingLLM, and 3.45× (or 1.86x) on CPU (GPU) over H2O. EQUIP with Paged Attention achieves speedups of 4.18x (2.61x) on CPU (GPU) over auto-regressive032 baselines. EQUIP preserves the same model accuracy as baseline pruning methods."

- title: "FARE: A Fine-grained Pipelined Reconfigurable FlashAttention Kernel"
  author: "Kaushikkumar S. Rathva"
  institution: "IISc"
  link: "https://dl.acm.org/doi/10.1145/3748173.3779572"
  abstract: |
    "Transformer algorithm-based large machine learning (ML) models are widely used in various application domains [3]. We observe that the attention operation of a transformer algorithm consumes a significant amount of execution time when executed on a GPU, affecting real-time latency for inference. While other major operations in the transformer algorithm (e.g., feed-forward operation) consist of weight stationary matrix multiplications, attention consists of non-linear operations and a sequence of matrix multiplications. This sequence of operations in attention results in memory access bottlenecks in GPUs, directly affecting the latency. While there exists an implementation of an attention kernel to minimize memory access bottlenecks -- FlashAttention [1] -- it lacks reconfigurability. Moreover, GPUs provide limited knobs for customizing the attention datapath. There exist application-specific accelerators for ML models with transformer algorithms, but they too lack reconfigurability [2]. FPGAs, in contrast, enable application-specific dataflows, giving us full control over the design. Therefore, in this work, we propose a fine-grained pipelined reconfigurable flash-attention kernel targeting FPGA platforms. The fine-grained pipelining allows us to execute different stages of the attention mechanism in parallel. It carefully constructs different stages of a flash-attention kernel to reduce resource usage as well as improve the performance. As ML models scale and energy demands increase, this makes FPGA-based attention the sustainable choice. Experimental evaluation on Xilinx Zedboard (Zynq 7000) with different parameters of the attention kernel shows that our proposed design improves the performance by up to 2.9× while reducing the resource usage by up to 16.50× over state-of-the-art."

- title: "FIFOAdvisor: A DSE Framework for Automated FIFO Sizing of High-Level Synthesis Designs"
  author: "Stefan Abi-Karam"
  institution: "Georgia Institute of Technology & UCLA"
  link: "https://ieeexplore.ieee.org/document/11420742"
  github: "https://github.com/sharc-lab/fifo-advisor"
  abstract: |
    "Dataflow hardware designs are important for efficient algorithm implementations on FPGAs across various domains using high-level synthesis (HLS). However, these designs pose a challenge: correctly and optimally sizing first-in-first-out (FIFO) channel buffers. FIFO sizes are user-defined parameters, introducing a trade-off between latency and area—undersized FIFOs cause stalls and increase latency, while oversized FIFOs waste on-chip memory. In many cases, insufficient FIFO sizes can also lead to deadlocks. Deciding the best FIFO sizes is non-trivial. Existing methods make limiting assumptions about FIFO access patterns, overallocate FIFOs conservatively, or use time-consuming RTL simulations to evaluate different FIFO sizes. Furthermore, we highlight that runtime-based analyses (i.e., simulation) are the only way to solve the FIFO optimization problem while ensuring a deadlock-free solution for designs with data-dependent control flow. To tackle this challenge, we propose FIFOAdvisor, a framework to automatically decide FIFO sizes in HLS designs. Our approach is powered by LightningSim, a fast simulator that is 99.9% cycle-accurate and supports millisecond-scale incremental simulations with new FIFO configurations. We formulate FIFO sizing as a dual-objective black-box optimization problem and explore various heuristic and search-based methods to analyze the latency–resource trade-off. We also integrate FIFOAdvisor with Stream-HLS, a recent framework for optimizing affine dataflow designs lowered from C++, MLIR, or PyTorch, enabling deeper optimization of the heavily-used FIFOs in these workloads. We evaluate FIFOAdvisor on a suite of Stream-HLS benchmarks, including linear algebra and deep learning workloads, to demonstrate our approach’s ability to optimize large and dynamic dataflow patterns. Our results show Pareto-optimal latency–memory usage frontiers for FIFO configurations generated via different optimization strategies. Compared to baseline designs with naïvely-sized FIFOs, FIFOAdvisor identifies configurations with much lower memory usage and minimal delay overhead. Additionally, we measure the runtime of our optimization process and demonstrate significant speedups compared to traditional HLS/RTL co-simulation-based approaches, making FIFOAdvisor practical for rapid design space exploration. Finally, we present a case study using FIFOAdvisor to optimize a complex hardware accelerator with non-trivial data-dependent control flow."

- title: "FlexLLM: Composable HLS Library for Flexible Hybrid LLM Accelerator Design"
  author: "Jiahao Zhang"
  institution: "UCLA, AMD"
  link: "https://arxiv.org/abs/2601.15710"
  abstract: |
    "We present FlexLLM, a composable High-Level Synthesis (HLS) library for rapid development of domain-specific LLM accelerators. FlexLLM exposes key architectural degrees of freedom for stage-customized inference, enabling hybrid designs that tailor temporal reuse and spatial dataflow differently for prefill and decode, and provides a comprehensive quantization suite to support accurate low-bit deployment. Using FlexLLM, we build a complete inference system for the Llama-3.2 1B model in under two months with only 1K lines of code. The system includes: (1) a stage-customized accelerator with hardware-efficient quantization (12.68 WikiText-2 PPL) surpassing SpinQuant baseline, and (2) a Hierarchical Memory Transformer (HMT) plug-in for efficient long-context processing. On the AMD U280 FPGA at 16nm, the accelerator achieves 1.29\times end-to-end speedup, 1.64\times higher decode throughput, and 3.14\times better energy efficiency than an NVIDIA A100 GPU (7nm) running BF16 inference; projected results on the V80 FPGA at 7nm reach 4.71\times, 6.55\times, and 4.13\times, respectively. In long-context scenarios, integrating the HMT plug-in reduces prefill latency by 23.23\times and extends the context window by 64\times, delivering 1.10\times/4.86\times lower end-to-end latency and 5.21\times/6.27\times higher energy efficiency on the U280/V80 compared to the A100 baseline. FlexLLM thus bridges algorithmic innovation in LLM inference and high-performance accelerators with minimal manual effort."

